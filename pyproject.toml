[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hela-mem"
version = "0.1.0"
description = "HeLa-Mem code for LongMemEval and LoCoMo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "openai>=1.0",
  "sentence-transformers",
  "torch",
  "transformers>=4.51.0",
  "peft>=0.15.0",
]

[tool.setuptools]
packages = ["hela_mem"]
